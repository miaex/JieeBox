name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the "Actions" tab in GitHub (useful from a phone browser).
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Uses Gradle directly (via this action) instead of a committed
      # gradlew wrapper, so nothing needs to run locally beforehand.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JieeBox-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
